# blocked.example.com — HTTP-only bootstrap (no certificate yet)
#
# Used only while certbot has not issued a certificate for this hostname.
# It answers ACME challenges and nothing else.

server {
    listen 80;
    listen [::]:80;
    server_name blocked.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
