# blocked.example.com — the page blocked visitors are redirected to.
#
# This vhost serves exactly one static file, /var/www/blocked.example.com/index.html,
# which the monitor rewrites from the panel ("失败页" content). It is deliberately
# a separate hostname: the filter never includes this vhost, so a blocked client
# can always reach it, and example.com's own config stays untouched.
#
#   certbot certonly --webroot -w /var/www/certbot -d blocked.example.com

server {
    listen 80;
    listen [::]:80;
    server_name blocked.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://blocked.example.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blocked.example.com;

    ssl_certificate     /etc/letsencrypt/live/blocked.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blocked.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;

    root /var/www/blocked.example.com;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
